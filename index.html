<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Client Radar — VK авторизация</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #f5f7fa;
    }
    main {
      width: min(560px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid #2a2f3a;
      border-radius: 18px;
      background: #171a21;
      box-shadow: 0 16px 60px rgba(0,0,0,.28);
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 8px 0; line-height: 1.55; color: #c9ced8; }
    .status { margin-top: 20px; padding: 14px 16px; border-radius: 12px; background: #202530; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 15px;
      border-radius: 10px;
      color: #fff;
      background: #3f76ff;
      text-decoration: none;
      font-weight: 600;
    }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Client Radar</h1>
    <p>Авторизация VK завершена. Возвращаю данные в локальный Client Radar.</p>
    <div class="status" id="status">Перенаправление…</div>
    <a id="manual" href="http://localhost:8501/">Вернуться в Client Radar</a>
  </main>

  <script>
    (() => {
      const LOCAL_URL = 'http://localhost:8501/';
      const status = document.getElementById('status');
      const manual = document.getElementById('manual');

      // VK ID normally returns OAuth parameters in the query string.
      // Preserve both query and fragment to make the relay tolerant of flow changes.
      const query = window.location.search || '';
      const hash = window.location.hash || '';
      const target = LOCAL_URL + query + hash;

      manual.href = target;

      const params = new URLSearchParams(query);
      if (params.get('error')) {
        status.textContent = 'VK вернул ошибку авторизации. Возвращаю детали в Client Radar…';
      } else if (params.get('code')) {
        status.textContent = 'Код авторизации получен. Возвращаюсь в Client Radar…';
      } else {
        status.textContent = 'Получены данные от VK. Возвращаюсь в Client Radar…';
      }

      window.setTimeout(() => {
        window.location.replace(target);
      }, 700);
    })();
  </script>
</body>
</html>
